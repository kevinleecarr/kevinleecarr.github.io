<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 20px;
        }
        
        .header-left a,
        .header-right a {
            color: #000;
            text-decoration: none;
            font-size: 13px;
            margin: 0 15px;
        }
        
        .header-left a:hover,
        .header-right a:hover {
            text-decoration: underline;
        }
        
        .header-right {
            display: flex;
            align-items: center;
        }
        
        .sign-in-btn {
            background-color: #1a73e8;
            color: white;
            padding: 9px 23px;
            border-radius: 4px;
            margin-left: 15px;
            font-weight: 500;
        }
        
        .sign-in-btn:hover {
            background-color: #1765cc;
            box-shadow: 0 1px 2px 0 rgba(66,133,244,0.3),
                        0 1px 3px 1px rgba(66,133,244,0.15);
        }
        
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .logo {
            font-size: 90px;
            font-weight: 400;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .logo span:nth-child(1) { color: #4285F4; }
        .logo span:nth-child(2) { color: #EA4335; }
        .logo span:nth-child(3) { color: #FBBC05; }
        .logo span:nth-child(4) { color: #4285F4; }
        .logo span:nth-child(5) { color: #34A853; }
        .logo span:nth-child(6) { color: #EA4335; }
        
        .hello-world {
            font-size: 48px;
            color: #202124;
            margin-bottom: 40px;
            text-align: center;
        }
        
        .search-container {
            width: 100%;
            max-width: 584px;
            margin-bottom: 30px;
        }
        
        .search-box {
            display: flex;
            align-items: center;
            border: 1px solid #dfe1e5;
            border-radius: 24px;
            padding: 10px 20px;
            width: 100%;
            height: 44px;
        }
        
        .search-box:hover {
            box-shadow: 0 1px 6px rgba(32,33,36,0.28);
            border-color: rgba(223,225,229,0);
        }
        
        .search-icon {
            width: 20px;
            height: 20px;
            margin-right: 13px;
            opacity: 0.6;
        }
        
        .search-input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 16px;
        }
        
        .buttons {
            display: flex;
            gap: 14px;
            justify-content: center;
        }
        
        .btn {
            background-color: #f8f9fa;
            border: 1px solid #f8f9fa;
            border-radius: 4px;
            color: #3c4043;
            font-family: Arial, sans-serif;
            font-size: 14px;
            padding: 10px 16px;
            cursor: pointer;
        }
        
        .btn:hover {
            box-shadow: 0 1px 1px rgba(0,0,0,0.1);
            background-color: #f8f9fa;
            border: 1px solid #dadce0;
            color: #202124;
        }
        
        footer {
            background-color: #f2f2f2;
            border-top: 1px solid #e4e4e4;
        }
        
        .footer-top {
            padding: 15px 30px;
            border-bottom: 1px solid #dadce0;
            color: #70757a;
            font-size: 15px;
        }
        
        .footer-bottom {
            display: flex;
            justify-content: space-between;
            padding: 15px 30px;
            flex-wrap: wrap;
        }
        
        .footer-links {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }
        
        .footer-links a {
            color: #70757a;
            text-decoration: none;
            font-size: 14px;
        }
        
        .footer-links a:hover {
            text-decoration: underline;
        }
        
        @media (max-width: 768px) {
            .logo {
                font-size: 60px;
            }
            
            .hello-world {
                font-size: 32px;
            }
            
            .footer-bottom {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-left">
            <a href="#">About</a>
            <a href="#">Store</a>
        </div>
        <div class="header-right">
            <a href="#">Gmail</a>
            <a href="#">Images</a>
            <a href="#" class="sign-in-btn">Sign in</a>
        </div>
    </header>
    
    <main>
        <div class="logo">
            <span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
        </div>
        
        <div class="hello-world">Hello World</div>
        
        <div class="search-container">
            <div class="search-box">
                <svg class="search-icon" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path fill="#9aa0a6" d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"></path>
                </svg>
                <input type="text" class="search-input" placeholder="Search Google or type a URL">
            </div>
        </div>
        
        <div class="buttons">
            <button class="btn">Google Search</button>
            <button class="btn">I'm Feeling Lucky</button>
        </div>
    </main>
    
    <footer>
        <div class="footer-top">
            United States
        </div>
        <div class="footer-bottom">
            <div class="footer-links">
                <a href="#">Advertising</a>
                <a href="#">Business</a>
                <a href="#">How Search works</a>
            </div>
            <div class="footer-links">
                <a href="#">Privacy</a>
                <a href="#">Terms</a>
                <a href="#">Settings</a>
            </div>
        </div>
    </footer>
</body>
</html>
